name: Build ATML PA2 NeurIPS report
on:
  push:
    paths:
      - "Assignment-2/Report/**"
      - ".github/workflows/atml-pa2-report.yml"
  workflow_dispatch:
jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Summarize archived evidence schemas
        run: |
          python3 - <<'PY'
          import tarfile, json, glob, pathlib
          for path in sorted(glob.glob('Assignment-2/backups/*BACKUP*.tar.gz')):
              if 'EMERGENCY' in path: continue
              print('ARCHIVE',path,flush=True)
              with tarfile.open(path,'r:gz') as ar:
                  matches=[n for n in ar.getnames() if n.endswith(('.jsonl','.json')) and ('examples' in n or 'word_limit' in n or 'judged_' in n or 'perturbation' in n)]
                  print('MEMBERS', matches[:42],flush=True)
                  for name in matches[:18]:
                      try:
                          f=ar.extractfile(name)
                          if not f: continue
                          raw=f.readline()
                          if not raw: continue
                          item=json.loads(raw)
                          if isinstance(item,list): item=item[0] if item else {}
                          if isinstance(item,dict):
                              print('SCHEMA',name,[(k,type(v).__name__) for k,v in item.items()][:32],flush=True)
                      except Exception as e: print('SCHEMA_ERR',name,str(e)[:90],flush=True)
          PY
      - name: Print source-grounded example excerpts for report audit
        run: |
          python3 - <<'PY'
          import json,tarfile,pathlib
          ROOT=pathlib.Path('Assignment-2/backups')
          def readfile(arc,p):
              f=arc.extractfile(p);return [json.loads(line) for line in f if line.strip()]
          def abbreviated(x):
              return ' '.join(str(x).split())[:190]
          with tarfile.open(ROOT/'ATML_PA2_Task1_BACKUP (1).tar.gz') as a:
              wr=readfile(a,'results/task1_dpo/standard_word_limits.jsonl')
              for x in [z for z in wr if z['compliant']==0][:3]:
                  print('EXAMPLE_DPO_WORD',json.dumps({k:(abbreviated(v) if k in ('prompt','response') else v) for k,v in x.items()},ensure_ascii=True),flush=True)
          with tarfile.open(ROOT/'ATML_PA2_Task2_BACKUP (1).tar.gz') as a:
              rows=readfile(a,'results/task2_ppo/kl_0.10_examples.jsonl')
              for x in sorted([z for z in rows if z.get('truncated') or not z.get('terminated_with_eos')],key=lambda z:-z['reward'])[:3]:
                  print('EXAMPLE_PPO_REWARD_INCOMPLETE',json.dumps({k:(abbreviated(v) if k=='response' else v) for k,v in x.items() if k in ('source_index','reward','response_tokens','truncated','terminated_with_eos','response')},ensure_ascii=True),flush=True)
          with tarfile.open(ROOT/'ATML_PA2_Task3_BACKUP (1).tar.gz') as a:
              rows=readfile(a,'results/task3_grpo/standard_examples.jsonl')
              for x in sorted([z for z in rows if z.get('truncated')],key=lambda z:-z['reward'])[:2]:
                  print('EXAMPLE_GRPO_TRUNC',json.dumps({k:(abbreviated(v) if k=='response' else v) for k,v in x.items() if k in ('source_index','reward','response_tokens','truncated','response')},ensure_ascii=True),flush=True)
          with tarfile.open(ROOT/'ATML_PA2_Task4_COMPUTE_BACKUP.tar.gz') as a:
              rows=readfile(a,'results/task4_safety/judged_sft.jsonl')
              for x in [z for z in rows if z['benchmark_class']=='SAFE' and z['label']=='JUSTIFIED_REFUSAL'][:3]:
                  print('EXAMPLE_SAFETY_SAFE_JUSTIFIED',json.dumps({k:(abbreviated(v) if k in ('prompt','response') else v) for k,v in x.items() if k in ('xstest_id','type','prompt','response','label')},ensure_ascii=True),flush=True)
          with tarfile.open(ROOT/'ATML_PA2_Task5_BACKUP.tar.gz') as a:
              rows=readfile(a,'results/task5_feedback/perturbation_pairs.jsonl')
              for v in ['corrupt_reasoning_correct_final','persuasive_filler_correct','good_reasoning_wrong_final','gold_distractor_wrong_final']:
                  x=next(z for z in rows if z['variant_type']==v)
                  print('EXAMPLE_TASK5',json.dumps({'problem_id':x['problem_id'],'variant':v,'judge_pref':x['preference'],'clean_r':x['clean_exact_reward'],'variant_r':x['variant_exact_reward'],'clean_end':' '.join(x['clean_response'].split())[-190:],'variant_end':' '.join(x['variant_response'].split())[-190:]},ensure_ascii=True),flush=True)
          PY
      - name: Validate report assets
        run: python3 Assignment-2/Report/scripts/verify_assets.py
      - name: Compile NeurIPS 2026 report
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: Assignment-2/Report
          root_file: main.tex
          latexmk_use_xelatex: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error
      - name: Upload compiled report skeleton
        uses: actions/upload-artifact@v4
        with:
          name: atml-pa2-neurips-report-skeleton
          path: Assignment-2/Report/main.pdf
